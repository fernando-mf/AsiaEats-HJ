info:
  title: AsiaEats API
  description: EatChinese NestJS API
  version: "1.0"
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    StatusResponse:
      type: object
      properties:
        status:
          type: string
        datetime:
          type: string
      required:
        - status
        - datetime
    AccountCreationRequest:
      type: object
      properties:
        role:
          type: string
          enum:
            - customer
            - restaurant
            - courier
            - operator
        username:
          type: string
        password:
          type: string
          minLength: 8
        name:
          type: string
          minLength: 3
      required:
        - role
        - username
        - password
        - name
    AccountResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        username:
          type: string
        role:
          enum:
            - customer
            - restaurant
            - courier
            - operator
          type: string
        createdAt:
          format: date-time
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
        - id
        - name
        - username
        - role
        - createdAt
        - updatedAt
    FieldErrorResponse:
      type: object
      properties:
        field:
          type: string
        messages:
          type: array
          items:
            type: string
      required:
        - field
        - messages
    ErrorResponse:
      type: object
      properties:
        code:
          type: string
        entityType:
          type: string
        reason:
          type: string
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldErrorResponse"
      required:
        - code
    LoginRequest:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required:
        - username
        - password
    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
        account:
          $ref: "#/components/schemas/AccountResponse"
      required:
        - accessToken
        - account
    AddressRequest:
      type: object
      properties:
        street:
          type: string
          minLength: 3
          maxLength: 200
        city:
          type: string
          minLength: 2
          maxLength: 100
        postalCode:
          type: string
          minLength: 3
          maxLength: 10
        latitude:
          type: number
        longitude:
          type: number
      required:
        - street
        - city
        - postalCode
        - latitude
        - longitude
    CustomerUpdateRequest:
      type: object
      properties:
        address:
          $ref: "#/components/schemas/AddressRequest"
      required:
        - address
    Address:
      type: object
      properties:
        street:
          type: string
        city:
          type: string
        postalCode:
          type: string
        latitude:
          type: number
        longitude:
          type: number
      required:
        - street
        - city
        - postalCode
        - latitude
        - longitude
    CustomerResponse:
      type: object
      properties:
        address:
          nullable: true
          type: object
          allOf:
            - $ref: "#/components/schemas/Address"
        createdAt:
          format: date-time
          type: string
        updatedAt:
          format: date-time
          type: string
        account:
          $ref: "#/components/schemas/AccountResponse"
      required:
        - address
        - createdAt
        - updatedAt
        - account
    OrderItemRequest:
      type: object
      properties:
        menuItemId:
          type: string
          format: uuid
        quantity:
          type: number
          minimum: 1
      required:
        - menuItemId
        - quantity
    OrderPlacementRequest:
      type: object
      properties:
        restaurantId:
          type: string
          format: uuid
        items:
          minItems: 1
          type: array
          items:
            $ref: "#/components/schemas/OrderItemRequest"
      required:
        - restaurantId
        - items
    OrderLine:
      type: object
      properties:
        id:
          type: string
        orderId:
          type: string
        menuItemId:
          type: string
        name:
          type: string
        unitPrice:
          type: number
        quantity:
          type: number
      required:
        - id
        - orderId
        - menuItemId
        - name
        - unitPrice
        - quantity
    Order:
      type: object
      properties:
        id:
          type: string
        customerId:
          type: string
        restaurantId:
          type: string
        status:
          enum:
            - placed
            - accepted
            - preparing
            - ready
            - picked_up
            - delivered
            - rejected
            - cancelled
