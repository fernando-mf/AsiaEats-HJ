info:
  title: AsiaEats API
  description: EatChinese NestJS API
  version: "1.0"
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    StatusResponse:
      type: object
      properties:
        status:
          type: string
        datetime:
          type: string
      required:
        - status
        - datetime
    AccountCreationRequest:
      type: object
      properties:
        role:
          type: string
          enum:
            - customer
            - restaurant
            - courier
            - operator
        username:
          type: string
        password:
          type: string
          minLength: 8
        name:
          type: string
          minLength: 3
      required:
        - role
        - username
        - password
        - name
    AccountResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        username:
          type: string
        role:
          enum:
            - customer
            - restaurant
            - courier
            - operator
          type: string
        createdAt:
          format: date-time
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
        - id
        - name
        - username
        - role
        - createdAt
        - updatedAt
    FieldErrorResponse:
      type: object
      properties:
        field:
          type: string
        messages:
          type: array
          items:
            type: string
      required:
        - field
        - messages
    ErrorResponse:
      type: object
      properties:
        code:
          type: string
        entityType:
          type: string
        reason:
          type: string
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldErrorResponse"
      required:
        - code
    LoginRequest:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required:
        - username
        - password
    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
        account:
          $ref: "#/components/schemas/AccountResponse"
      required:
        - accessToken
        - account
    Position:
      type: object
      properties:
        latitude:
          type: number
        longitude:
          type: number
      required:
        - latitude
        - longitude
    RestaurantCreationRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 3
        status:
          type: string
          enum:
            - open
            - paused
            - closed
        position:
          $ref: "#/components/schemas/Position"
      required:
        - name
        - position
    Restaurant:
      type: object
      properties:
        id:
          type: string
        ownerId:
          type: string
        name:
          type: string
        status:
          enum:
            - open
            - paused
            - closed
          type: string
        position:
          $ref: "#/components/schemas/Position"
        createdAt:
          format: date-time
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
        - id
        - ownerId
        - name
        - status
        - position
        - createdAt
        - updatedAt
    RestaurantUpdateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 3
        position:
          $ref: "#/components/schemas/Position"
      required:
        - name
        - position
    RestaurantStatusUpdateRequest:
      type: object
      properties:
        status:
          type: string
          enum:
            - open
            - paused
            - closed
      required:
        - status
    MenuItemCreationRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        price:
          type: number
          minimum: 0
        status:
          type: string
          enum:
            - available
            - sold_out
      required:
        - name
        - price
    MenuItem:
      type: object
      properties:
        id:
          type: string
        restaurantId:
          type: string
        name:
          type: string
        price:
          type: number
        status:
          type: string
          enum:
            - available
            - sold_out
        createdAt:
          format: date-time
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
        - id
        - restaurantId
        - name
        - price
        - status
        - createdAt
        - updatedAt
